
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #07509a;
            color: #fff4c4;
            font-family: Arial, sans-serif;
        }

        /* Lateral decorada */
        .lateral {
            width: 11%;
            background-color: #07509a;
            border-right: 3px solid #d45b30;
            background-image:
                repeating-linear-gradient(45deg,
                transparent 0px, transparent 18px,
                #fff4c4 19px, #fff4c4 21px,
                transparent 22px, transparent 38px),
                repeating-linear-gradient(-45deg,
                transparent 0px, transparent 18px,
                #fff4c4 19px, #fff4c4 21px,
                transparent 22px, transparent 38px);
        }

        /* Parte central */
        .conteudo {
            width: 50%;
            padding: 10px 50px;
        }

        /* Menu superior */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        nav button {
            background: none;
            border: none;
            color: white;
            font-size: 43px;
            cursor: pointer;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 43px;
        }

        .perfil {
            background-color: #ccc;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        /* Título */
        h1 {
            font-family: Georgia, serif;
            font-size: 65px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Categorias */
        h2 {
            font-family: Georgia, serif;
            font-size: 40px;
            margin-bottom: 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 23px;
            margin-bottom: 14px;
        }

        .outros {
            margin-top: 15px;
        }
        
        .imagens {
            width: 39%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            border-left: 2px solid white;
        }

        .imagens img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .imagem1 {
            grid-column: 2;
            grid-row: 1;
        }

        .imagem2 {
            grid-column: 1;
            grid-row: 2;
        }

        .imagem3 {
            grid-column: 2;
            grid-row: 3;
        }
        @media (max-width: 750px) {
            body {
                flex-wrap: wrap;
            }

            .lateral {
                display: none;
            }

            .conteudo {
                width: 100%;
                padding: 15px;
            }

            h1 {
                font-size: 43px;
            }

            h2 {
                font-size: 32px;
            }

            .item {
                font-size: 18px;
            }

            nav button, nav a {
                font-size: 32px;
            }

            .imagens {
                width: 100%;
                height: 400px;
            }
        }

    </style>
</head>

<body>

    <div class="lateral"></div>

    <section class="conteudo">

        <nav>
            <button onclick="history.back()">↩</button>

            <a href="index.html">⌂</a>

            <a href="pedido.html">🛒</a>

            <div class="perfil">●</div>
        </nav>

        <h1>Cardápio Digital</h1>

        <h2>Esquentados</h2>

        <div class="item">
            <span>Hambúrguer</span>
            <span>R$7,00</span>
        </div>

        <div class="item">
            <span>Mini-pizza</span>
            <span>R$5,00</span>
        </div>

        <div class="item">
            <span>Pão de queijo</span>
            <span>R$3,00</span>
        </div>

        <h2 class="outros">Outros</h2>

        <div class="item">
            <span>Torcida</span>
            <span>R$2,50</span>
        </div>

        <div class="item">
            <span>Trento</span>
            <span>R$2,00</span>
        </div>

        <div class="item">
            <span>Chips</span>
            <span>R$4,00</span>
        </div>

        <div class="item">
            <span>Pé de moleque</span>
            <span>R$1,50</span>
        </div>

        <div class="item">
            <span>Paçoquinha</span>
            <span>R$0,50</span>
        </div>

    </section>

    <section class="imagens">

        <img class="imagem1" src="hamburguer.jpg" alt="Hambúrguer">

        <img class="imagem2" src="mini-pizza.jpg" alt="Mini-pizza">

        <img class="imagem3" src="pao-de-queijo.jpg" alt="Pão de queijo">

    </section>

</body>
</html>
