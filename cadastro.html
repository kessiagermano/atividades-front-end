
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b5cb3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #1a428a;
            padding: 25px;
            text-align: center;
            color: white;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }

        .btn-cadastro {
            background-color: #12316c;
            color: white;
            text-decoration: none;
            padding: 18px 45px;
            border-radius: 50px;
            font-size: 22px;
        }

        footer {
            background-color: #1a428a;
            height: 45px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cadastro</h1>
    </header>

    <main>
        <a href="#cadastro-administrador" class="btn-cadastro">
            Administrador
        </a>

        <a href="#cadastro-aluno" class="btn-cadastro">
            Aluno
        </a>
    </main>

    <footer></footer>

</body>
</html>
